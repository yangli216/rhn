spring:
  config:
    activate:
      on-profile: rebuild-oracle
  datasource:
    url: ${RHN_REBUILD_DB_URL:${RHN_ORACLE_URL}}
    username: ${RHN_REBUILD_DB_USER:${RHN_ORACLE_USER}}
    password: ${RHN_REBUILD_DB_PASSWORD:${RHN_ORACLE_PASSWORD}}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    locations: classpath:db/rebuild/oracle,classpath:db/rebuild/oracle-local
    # A rebuild target must be empty; do not use this profile to retrofit an
    # existing schema. The normal oracle-local profile remains the upgrade path.
    clean-disabled: true

