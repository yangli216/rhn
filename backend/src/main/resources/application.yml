spring:
  application:
    name: rhn-application
  datasource:
    url: ${RHN_DB_URL:jdbc:postgresql://localhost:5432/rhn}
    username: ${RHN_DB_USER:rhn}
    password: ${RHN_DB_PASSWORD:rhn_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    error:
      include-message: never

server:
  port: ${RHN_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${RHN_OPENAPI_ENABLED:false}

rhn:
  id:
    data-center-id: ${RHN_ID_DATA_CENTER_ID:0}
    worker-id: ${RHN_ID_WORKER_ID:0}
    allow-default-node: ${RHN_ID_ALLOW_DEFAULT_NODE:false}
  security:
    dev-user-enabled: false
  crypto:
    # Production deliberately has no fallback provider. Critical-data writes fail closed
    # until a compliant cryptographic service adapter is configured.
    active-provider: ${RHN_CRYPTO_ACTIVE_PROVIDER:}
    enforce-compliance: ${RHN_CRYPTO_ENFORCE_COMPLIANCE:true}
    required-digest-algorithm: ${RHN_CRYPTO_REQUIRED_DIGEST_ALGORITHM:SM3}
    required-signature-algorithm: ${RHN_CRYPTO_REQUIRED_SIGNATURE_ALGORITHM:SM2}
  configuration:
    cache:
      maximum-size: ${RHN_CONFIGURATION_CACHE_MAXIMUM_SIZE:10000}
      maximum-ttl: ${RHN_CONFIGURATION_CACHE_MAXIMUM_TTL:PT5M}
  dictionary:
    translation:
      cache:
        maximum-size: ${RHN_DICTIONARY_TRANSLATION_CACHE_MAXIMUM_SIZE:10000}
        maximum-ttl: ${RHN_DICTIONARY_TRANSLATION_CACHE_MAXIMUM_TTL:PT5M}
