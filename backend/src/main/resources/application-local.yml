spring:
  datasource:
    url: jdbc:h2:mem:rhn-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    locations: classpath:db/migration,classpath:db/local,classpath:db/h2
rhn:
  ai:
    mode: LOCAL_ASSIST
    provider: local-assist
    model: local-rules-v1
    suggestion-ttl: PT30M
  id:
    allow-default-node: true
  security:
    dev-user-enabled: true
    dev-username: ${RHN_DEV_USERNAME:doctor}
    dev-password: ${RHN_DEV_PASSWORD:rhn-dev-2026}
    session-registry: ${RHN_SESSION_REGISTRY:memory}
    refresh-login:
      cookie-secure: false
  crypto:
    # Local-only continuity provider. It is intentionally rejected when compliance
    # enforcement is enabled and must never be used as production evidence.
    active-provider: development-jca
    enforce-compliance: false
    secret-encryption-key: ${RHN_SECRET_ENCRYPTION_KEY:cmhuLWxvY2FsLWRldmVsb3BtZW50LWtleS0yMDI2ISE=}
    secret-encryption-key-id: ${RHN_SECRET_ENCRYPTION_KEY_ID:local-development}
  presence:
    store: ${RHN_PRESENCE_STORE:memory}
springdoc:
  api-docs:
    enabled: true
