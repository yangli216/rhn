spring:
  datasource:
    url: jdbc:h2:mem:rhn-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/local,classpath:db/h2
rhn:
  maintenance:
    worker-enabled: false
  search:
    projection:
      rebuild-on-startup: false
  ai:
    mode: LOCAL_ASSIST
    provider: local-assist
    model: local-rules-v1
    suggestion-ttl: PT30M
  id:
    allow-default-node: true
  security:
    dev-user-enabled: true
    dev-username: doctor
    dev-password: test-password
    # Every HTTP Basic request re-checks BCrypt; cost 4 instead of 10 keeps it off the test hot path.
    password-bcrypt-strength: 4
    session-registry: memory
    refresh-login:
      cookie-secure: false
  crypto:
    active-provider: development-jca
    enforce-compliance: false
    secret-encryption-key: cmhuLXRlc3QtZGV2ZWxvcG1lbnQta2V5LTIwMjYhISE=
    secret-encryption-key-id: test-development
  eventing:
    outbox:
      enabled: false
  pharmacy:
    require-settlement-authorization: false
    prescription-review:
      mode-override: PRE_DISPENSE
  presence:
    store: memory
  billing:
    fiscal:
      mock-enabled: true
    payment:
      routing:
        external-handoff-enabled: true
      direct:
        enabled: false
      aggregated-adapter:
        enabled: false
    insurance:
      chs:
        mock-enabled: true
      chs-adapter:
        enabled: false
springdoc:
  api-docs:
    enabled: true
