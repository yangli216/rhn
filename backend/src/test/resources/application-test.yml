spring:
  datasource:
    url: jdbc:h2:mem:rhn-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/local,classpath:db/h2
rhn:
  ai:
    mode: LOCAL_ASSIST
    provider: local-assist
    model: local-rules-v1
    suggestion-ttl: PT30M
  id:
    allow-default-node: true
  security:
    dev-user-enabled: true
    dev-username: doctor
    dev-password: test-password
    session-registry: memory
    refresh-login:
      cookie-secure: false
  crypto:
    active-provider: development-jca
    enforce-compliance: false
    secret-encryption-key: cmhuLXRlc3QtZGV2ZWxvcG1lbnQta2V5LTIwMjYhISE=
    secret-encryption-key-id: test-development
  eventing:
    outbox:
      enabled: false
  pharmacy:
    require-settlement-authorization: false
    prescription-review:
      mode-override: PRE_DISPENSE
  presence:
    store: memory
  billing:
    payment:
      aggregated-adapter:
        enabled: false
    insurance:
      chs-adapter:
        enabled: false
springdoc:
  api-docs:
    enabled: true
