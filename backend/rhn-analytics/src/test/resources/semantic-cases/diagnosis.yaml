    metrics:
      - "OP_VALID_DIAGNOSIS_RECORD_COUNT"
    dimensions:
      - "ENCOUNTER_DEPARTMENT"
    period:
      type: "MONTH_TO_DATE"
    scope: "AUTHORIZED"
