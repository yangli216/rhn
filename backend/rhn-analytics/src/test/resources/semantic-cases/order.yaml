    intent: "METRIC_SUMMARY"
    metrics:
      - "OP_CANCELLED_ORDER_COUNT"
    dimensions:
      - "MONTH"
    period:
      type: "LAST_MONTH"
    scope: "CURRENT"

- id: "A018"
  category: "ORDER"
  question: "本月门诊医嘱按医嘱类别分布"
  description: "统计本月门诊医嘱在药品医嘱与服务医嘱两个类别的条数构成"
  expected:
    status: "READY"
    intent: "DISTRIBUTION"
    metrics:
      - "OP_ACTIVE_ORDER_COUNT"
    dimensions:
      - "ORDER_TYPE"
    period:
      type: "MONTH_TO_DATE"
    scope: "CURRENT"
