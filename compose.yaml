services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rhn
      POSTGRES_USER: rhn
      POSTGRES_PASSWORD: rhn_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhn -d rhn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rhn-postgres:/var/lib/postgresql/data

volumes:
  rhn-postgres:

