    <text x="92" y="929" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0" fill="#FFFFFF">04</text>
    <text x="128" y="920" text-anchor="start" font-size="19" font-weight="760" letter-spacing="0" fill="#173B3A">数据与运行基础</text>
    <text x="128" y="941" text-anchor="start" font-size="13" font-weight="500" letter-spacing="0" fill="#667B79">模块拥有数据、统一迁移、多数据库适配</text><rect x="72" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="88" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">PostgreSQL 17 / Oracle 19c</text><text x="88" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">生产持久化</text><rect x="368" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="384" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">H2 兼容模式</text><text x="384" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">自动化测试</text><rect x="664" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="680" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">Flyway V1–V66</text><text x="680" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">双库增量迁移</text><rect x="960" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="976" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">OpenAPI 契约</text><text x="976" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">前后端类型同步</text><rect x="1256" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="1272" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">Actuator / Metrics</text><text x="1272" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">健康与运行指标</text><rect x="1552" y="964" width="266" height="58" rx="14" fill="#EEF4F3" stroke="#D4E0DE" stroke-width="1.5"  /><text x="1568" y="987" text-anchor="start" font-size="14.5" font-weight="720" letter-spacing="0" fill="#173B3A">PDF / Excel</text><text x="1568" y="1008" text-anchor="start" font-size="12.5" font-weight="500" letter-spacing="0" fill="#667B79">受控输出与导入</text><text x="72" y="1042" font-size="14" fill="#78908D">依据：README、模块目录与依赖规则、建设路线图、数据库迁移 V1–V66</text>
