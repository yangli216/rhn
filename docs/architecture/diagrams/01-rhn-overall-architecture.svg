    <text x="92" y="211" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0" fill="#FFFFFF">01</text>
    <text x="128" y="202" text-anchor="start" font-size="19" font-weight="760" letter-spacing="0" fill="#173B3A">使用者与工作入口</text>
    <text x="128" y="223" text-anchor="start" font-size="13" font-weight="500" letter-spacing="0" fill="#667B79">按岗位进入统一门户，携带受信机构 / 科室工作上下文</text><rect x="72" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="90" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">居民 / 患者</text><text x="90" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">建档 · 就诊 · 支付</text><rect x="368" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="386" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">医生 / 护士</text><text x="386" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">接诊 · 医嘱 · 随访</text><rect x="664" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="682" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">药师 / 库管</text><text x="682" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">审方 · 发药 · 库存</text><rect x="960" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="978" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">收费 / 财务</text><text x="978" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">结算 · 票据 · 对账</text><rect x="1256" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="1274" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">公卫人员</text><text x="1274" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">筛查 · 任务 · 照护</text><rect x="1552" y="246" width="266" height="74" rx="16" fill="#FFFFFF" stroke="#D4E2DF" stroke-width="1.5"  /><text x="1570" y="274" text-anchor="start" font-size="17" font-weight="720" letter-spacing="0" fill="#173B3A">平台管理员</text><text x="1570" y="300" text-anchor="start" font-size="13.5" font-weight="500" letter-spacing="0" fill="#667B79">组织 · 主数据 · 配置</text><rect x="72" y="347" width="1776" height="76" rx="20" fill="url(#hero)" filter="url(#shadow)"/><text x="112" y="380" text-anchor="start" font-size="22" font-weight="760" letter-spacing="0" fill="#FFFFFF">统一工作门户</text><text x="112" y="405" text-anchor="start" font-size="14.5" font-weight="500" letter-spacing="0" fill="#CFEAE6">工作台 · 多标签页 · 任务与通知 · 岗位菜单 · 个人工作区</text><rect x="1335" y="368" width="142" height="34" rx="17" fill="#2B8A80" stroke="none" stroke-width="1.5"  /><text x="1406" y="391" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0" fill="#FFFFFF">租户上下文</text><rect x="1491" y="368" width="142" height="34" rx="17" fill="#2B8A80" stroke="none" stroke-width="1.5"  /><text x="1562" y="391" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0" fill="#FFFFFF">机构上下文</text><rect x="1647" y="368" width="166" height="34" rx="17" fill="#2B8A80" stroke="none" stroke-width="1.5"  /><text x="1730" y="391" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0" fill="#FFFFFF">科室类型上下文</text><rect x="72" y="456" width="40" height="40" rx="12" fill="#15756C" stroke="none" stroke-width="1.5"  />
