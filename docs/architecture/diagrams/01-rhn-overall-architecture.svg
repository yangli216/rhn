    <rect x="1726" y="538" width="70" height="34" rx="17" fill="#EAF0F2" stroke="none" stroke-width="1.5"  /><text x="1761" y="561" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0" fill="#506B78">M4</text>
    <text x="1576" y="559" text-anchor="start" font-size="20" font-weight="760" letter-spacing="0" fill="#506B78">医防协同域</text>
    <text x="1576" y="592" text-anchor="start" font-size="14.5" font-weight="450" fill="#667B79"><tspan x="1576" dy="0">高血压筛查 / 照护计划</tspan><tspan x="1576" dy="23">任务 / 随访 / 异常回流</tspan></text><rect x="72" y="688" width="40" height="40" rx="12" fill="#15756C" stroke="none" stroke-width="1.5"  />
    <text x="92" y="715" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0" fill="#FFFFFF">03</text>
    <text x="128" y="706" text-anchor="start" font-size="19" font-weight="760" letter-spacing="0" fill="#173B3A">共享平台能力</text>
    <text x="128" y="727" text-anchor="start" font-size="13" font-weight="500" letter-spacing="0" fill="#667B79">业务模块通过公开 API 复用，不直接访问其他模块数据</text><rect x="72" y="752" width="420" height="118" rx="18" fill="#FFFFFF" stroke="#D6E2E0" stroke-width="1.5"  filter="url(#shadow)"/>
    <rect x="72" y="752" width="8" height="118" rx="4" fill="#15756C"/>

    <text x="96" y="791" text-anchor="start" font-size="20" font-weight="760" letter-spacing="0" fill="#15756C">组织、身份与工作上下文</text>
    <text x="96" y="824" text-anchor="start" font-size="14.5" font-weight="450" fill="#667B79"><tspan x="96" dy="0">租户 / 机构 / 科室 / 人员 / 任职</tspan><tspan x="96" dy="23">IAM · 数据范围 · 同类科室单有效上下文</tspan></text><rect x="512" y="752" width="420" height="118" rx="18" fill="#FFFFFF" stroke="#D6E2E0" stroke-width="1.5"  filter="url(#shadow)"/>
