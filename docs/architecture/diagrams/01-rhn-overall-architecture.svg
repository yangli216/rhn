    <text x="984" y="559" text-anchor="start" font-size="20" font-weight="760" letter-spacing="0" fill="#B87822">药事供应域</text>
    <text x="984" y="592" text-anchor="start" font-size="14.5" font-weight="450" fill="#667B79"><tspan x="984" dy="0">审方 / 发退药 / 追溯</tspan><tspan x="984" dy="23">采购 / 库房 / 库存台账</tspan></text><rect x="1256" y="520" width="266" height="134" rx="18" fill="#FFFFFF" stroke="#D6E2E0" stroke-width="1.5"  filter="url(#shadow)"/>
