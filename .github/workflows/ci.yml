name: RHN CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  development-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI failure propagation and source snapshots
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_development_workflow.py' -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: |
          mkdir -p ../artifacts
          mvn --batch-mode verify 2>&1 | tee ../artifacts/backend-verify.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify database catalog against isolated migrations
        run: |
          node ../scripts/schema-workbench/cli.mjs refresh --source expected 2>&1 | tee ../artifacts/backend-schema-refresh.log
          node ../scripts/schema-workbench/cli.mjs check 2>&1 | tee ../artifacts/backend-schema-check.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: artifacts/backend-*.log
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check frontend Hooks and dependency boundaries
        run: |
          mkdir -p ../artifacts
          npm run code:check 2>&1 | tee ../artifacts/frontend-code-quality.log
      - name: Check UI standards
        run: |
          mkdir -p ../artifacts
          npm run ui:check 2>&1 | tee ../artifacts/frontend-ui-check.log
      - name: Run frontend tests
        if: always()
        run: npm run test 2>&1 | tee ../artifacts/frontend-test.log
      - name: Run schema collaboration tests
        if: always()
        run: npm run schema:test 2>&1 | tee ../artifacts/frontend-schema-test.log
      - name: Build frontend
        if: always()
        run: npm run build 2>&1 | tee ../artifacts/frontend-build.log
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: artifacts/frontend-*.log
          if-no-files-found: warn

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify committed OpenAPI contract and generated types
        # Same script as local verify-scope runs; diagnostics land in artifacts/api-contract-*.
        run: scripts/verify-api-contract.sh artifacts
      - name: Upload API contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-diagnostics
          path: artifacts/api-contract*
          if-no-files-found: warn
