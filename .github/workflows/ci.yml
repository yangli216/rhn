name: RHN CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify committed OpenAPI contract and generated types
        run: |
          cd backend
          mvn --batch-mode spring-boot:run -Dspring-boot.run.profiles=local > /tmp/rhn-contract.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              break
            fi
            sleep 1
          done
          cd ..
          curl --fail --silent --show-error http://localhost:8080/v3/api-docs -o docs/api/openapi.json
          cd frontend
          npm run api:generate
          cd ..
          git diff --exit-code -- docs/api/openapi.json frontend/src/shared/api/generated.ts
